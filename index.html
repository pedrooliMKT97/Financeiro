<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    
    <!-- Ícones personalizados -->
    <link rel="shortcut icon" href="meu-icone.png" type="image/png">
    <link rel="apple-touch-icon" href="meu-icone.png">
    <meta name="msapplication-TileImage" content="meu-icone.png">
    <meta name="msapplication-TileColor" content="#000000">

    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* Página Inicial */
        .pagina-inicial {
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .selecionar-perfil {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .selecionar-perfil select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            appearance: none;
        }

        .btn-acessar {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Página de Controle */
        .pagina-controle {
            display: none;
            padding: 20px;
        }

        /* Botão Voltar */
        .btn-voltar {
            background: #666;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        /* Estilos específicos da página de controle */
        .perfil-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .perfil-container select {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            max-width: 300px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        .salario-container {
            margin-bottom: 20px;
            text-align: center;
        }

        #salario {
            padding: 10px;
            width: 90%;
            max-width: 300px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        .form-gasto {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-gasto input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #saldo {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            transition: background-color 0.3s;
            color: white;
            text-align: center;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            color: black;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        #resetar {
            margin-top: 20px;
            width: 100%;
        }

        /* Botões de ação */
        .btn-editar, .btn-excluir {
            padding: 5px 10px;
            margin: 0 2px;
            border: none;
            cursor: pointer;
            background: none;
            font-size: 16px;
        }

        .btn-editar:hover { color: #4CAF50; }
        .btn-excluir:hover { color: #f44336; }

        /* Tema Bárbara */
        body.barbara {
            background-color: #fff0f5;
            color: black;
        }

        body.barbara::before {
            content: '❤️';
            position: absolute;
            font-size: 24px;
            color: #ff69b4;
            animation: float 6s infinite ease-in-out;
        }

        body.barbara::after {
            content: '💖';
            position: absolute;
            font-size: 24px;
            color: #ff69b4;
            animation: float 8s infinite ease-in-out;
        }

        body.barbara button {
            background-color: #ff69b4;
        }

        body.barbara button:hover {
            background-color: #ff1493;
        }

        body.barbara #saldo {
            background-color: #ff69b4;
        }

        /* Tema Pedro */
        body.pedro {
            background-color: black;
        }

        body.pedro::before {
            content: '⚡';
            position: absolute;
            font-size: 24px;
            color: #ff8c00;
            animation: float 5s infinite ease-in-out;
        }

        body.pedro::after {
            content: '✨';
            position: absolute;
            font-size: 24px;
            color: #ff8c00;
            animation: float 7s infinite ease-in-out;
        }

        body.pedro button {
            background-color: #ff4500;
        }

        body.pedro button:hover {
            background-color: #ff6347;
        }

        body.pedro #saldo {
            background-color: #ff4500;
        }

        /* Animações */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* Ajustes para mobile */
        @media (max-width: 600px) {
            .pagina-controle {
                padding: 10px;
            }

            .form-gasto {
                grid-template-columns: 1fr;
            }

            .btn-voltar {
                position: static;
                margin: 10px auto;
                display: block;
                width: 90%;
                text-align: center;
                order: 1;
            }

            #resetar {
                order: 2;
                margin-top: 10px;
            }

            table {
                font-size: 14px;
                overflow-x: auto;
                display: block;
            }

            th, td {
                padding: 8px;
                min-width: 100px;
            }

            .btn-editar, .btn-excluir {
                font-size: 14px;
                padding: 3px 6px;
            }

            .logo {
                font-size: 1.8em;
            }

            .selecionar-perfil {
                padding: 15px;
            }
        }

        /* Novo container para botões inferiores */
        .botoes-inferiores {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Página Inicial -->
    <div class="pagina-inicial" id="paginaInicial">
        <h1 class="logo">💰 Controle Conjunto</h1>
        
        <div class="selecionar-perfil">
            <h2>Selecione seu perfil</h2>
            <select id="selecaoPerfil">
                <option value="Pedro">Pedro</option>
                <option value="Barbara">Bárbara</option>
            </select>
            <button class="btn-acessar" onclick="acessarControle()">Acessar</button>
        </div>
    </div>

    <!-- Página de Controle -->
    <div class="pagina-controle" id="paginaControle">
        <div class="perfil-container">
            <label for="perfil">Selecione o Perfil:</label>
            <select id="perfil" onchange="carregarPerfil()">
                <option value="Pedro">Pedro</option>
                <option value="Barbara">Bárbara</option>
            </select>
        </div>

        <div class="salario-container">
            <label for="salario">Salário Atual:</label>
            <input type="number" id="salario" step="0.01">
        </div>

        <div class="form-gasto">
            <input type="text" id="item" placeholder="Item">
            <input type="number" id="valor" step="0.01" placeholder="Valor">
            <input type="date" id="data">
            <button type="button" onclick="adicionarGasto()">Aplicar</button>
        </div>

        <div id="saldo">
            Saldo Disponível: R$ <span id="valorSaldo">0.00</span>
        </div>

        <table id="tabelaGastos">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div class="botoes-inferiores">
            <button id="resetar" onclick="resetarDados()">Resetar</button>
            <a class="btn-voltar" href="javascript:void(0)" onclick="voltarParaInicio()">← Voltar</a>
        </div>
    </div>

    <script>
        // Variáveis globais
        let perfilAtual = 'Pedro';
        let dados = {
            Pedro: {
                gastos: JSON.parse(localStorage.getItem('Pedro_gastos')) || [],
                salario: parseFloat(localStorage.getItem('Pedro_salario')) || 0
            },
            Barbara: {
                gastos: JSON.parse(localStorage.getItem('Barbara_gastos')) || [],
                salario: parseFloat(localStorage.getItem('Barbara_salario')) || 0
            }
        };

        let editando = false;
        let indiceEdicao = -1;

        // Sistema de Navegação
        function acessarControle() {
            const perfil = document.getElementById('selecaoPerfil').value;
            document.getElementById('paginaInicial').style.display = 'none';
            document.getElementById('paginaControle').style.display = 'block';
            carregarControle(perfil);
        }

        function carregarControle(perfil) {
            document.getElementById('perfil').value = perfil;
            document.body.className = perfil.toLowerCase();
            inicializarControle();
        }

        function voltarParaInicio() {
            document.getElementById('paginaInicial').style.display = 'flex';
            document.getElementById('paginaControle').style.display = 'none';
            document.body.className = '';
        }

        // Controle de Gastos
        function inicializarControle() {
            document.getElementById('salario').value = dados[perfilAtual].salario;
            atualizarTabela();
            atualizarSaldo();

            document.getElementById('data').value = new Date().toISOString().split('T')[0];
        }

        function adicionarGasto() {
            const item = document.getElementById('item').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('data').value;

            if (!item || isNaN(valor) || !data) {
                alert('Preencha todos os campos!');
                return;
            }

            if (editando) {
                salvarEdicao(indiceEdicao);
            } else {
                dados[perfilAtual].gastos.push({ item, valor, data });
                salvarDados();
                atualizarTabela();
                atualizarSaldo();
                limparCampos();
            }
        }

        function editarGasto(index) {
            const gasto = dados[perfilAtual].gastos[index];
            
            document.getElementById('item').value = gasto.item;
            document.getElementById('valor').value = gasto.valor;
            document.getElementById('data').value = gasto.data;
            
            const btnAplicar = document.querySelector('.form-gasto button');
            btnAplicar.textContent = 'Salvar Edição';
            btnAplicar.onclick = () => salvarEdicao(index);
            
            editando = true;
            indiceEdicao = index;
        }

        function salvarEdicao(index) {
            const item = document.getElementById('item').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('data').value;

            if (!item || isNaN(valor) || !data) {
                alert('Preencha todos os campos!');
                return;
            }

            dados[perfilAtual].gastos[index] = { item, valor, data };
            
            const btnAplicar = document.querySelector('.form-gasto button');
            btnAplicar.textContent = 'Aplicar';
            btnAplicar.onclick = adicionarGasto;
            
            editando = false;
            indiceEdicao = -1;
            
            salvarDados();
            atualizarTabela();
            atualizarSaldo();
            limparCampos();
        }

        function excluirGasto(index) {
            if (confirm('Tem certeza que deseja excluir este gasto?')) {
                dados[perfilAtual].gastos.splice(index, 1);
                salvarDados();
                atualizarTabela();
                atualizarSaldo();
            }
        }

        function atualizarTabela() {
            const tbody = document.querySelector('#tabelaGastos tbody');
            tbody.innerHTML = '';
            
            dados[perfilAtual].gastos.forEach((gasto, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${gasto.item}</td>
                    <td>R$ ${gasto.valor.toFixed(2)}</td>
                    <td>${gasto.data}</td>
                    <td>
                        <button class="btn-editar" onclick="editarGasto(${index})">✏️</button>
                        <button class="btn-excluir" onclick="excluirGasto(${index})">❌</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function atualizarSaldo() {
            const salario = parseFloat(document.getElementById('salario').value) || 0;
            const totalGastos = dados[perfilAtual].gastos.reduce((acc, gasto) => acc + gasto.valor, 0);
            const saldo = salario - totalGastos;

            document.getElementById('valorSaldo').textContent = saldo.toFixed(2);

            const saldoElement = document.getElementById('saldo');
            let intensidadeVermelho = 0;
            
            if (saldo <= 200) {
                intensidadeVermelho = 100;
            } else {
                intensidadeVermelho = Math.max(0, 100 - ((saldo - 200) / 2));
            }
            
            saldoElement.style.backgroundColor = `hsl(0, ${intensidadeVermelho}%, 50%)`;
        }

        function resetarDados() {
            if (confirm('Tem certeza que deseja resetar todos os dados deste perfil?')) {
                dados[perfilAtual].gastos = [];
                dados[perfilAtual].salario = 0;
                document.getElementById('salario').value = '';
                salvarDados();
                atualizarTabela();
                atualizarSaldo();
            }
        }

        function salvarDados() {
            localStorage.setItem(`${perfilAtual}_gastos`, JSON.stringify(dados[perfilAtual].gastos));
            localStorage.setItem(`${perfilAtual}_salario`, dados[perfilAtual].salario);
        }

        function limparCampos() {
            document.getElementById('item').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('data').value = new Date().toISOString().split('T')[0];
        }

        document.getElementById('salario').addEventListener('change', () => {
            dados[perfilAtual].salario = parseFloat(document.getElementById('salario').value);
            salvarDados();
            atualizarSaldo();
        });

        // Carregar perfil inicial
        carregarControle(perfilAtual);
    </script>
</body>
</html
